const nodes=new vis.DataSet(baseNodes);
const edges=new vis.DataSet(baseEdges);
const G={};
baseEdges.forEach(e=>{(G[e.from]=G[e.from]||[]).push(e.to);(G[e.to]=G[e.to]||[]).push(e.from);});
const net=new vis.Network(document.getElementById('net'),{nodes,edges},{
  nodes:{shape:'dot',scaling:{min:12,max:46},font:{color:'#ddd',size:11,strokeWidth:0}},
  edges:{color:{color:'#444',highlight:'#ffcc44'},width:0.4,smooth:false},
  physics:{solver:'barnesHut',barnesHut:{gravitationalConstant:-3000,springLength:60,springConstant:0.02},
           stabilization:{iterations:300}},
  interaction:{hover:true,tooltipDelay:120,hideEdgesOnDrag:true}
});
net.once('stabilizationIterationsDone',()=>net.setOptions({physics:false}));

// bottom status bar: show hovered word or hovered edge (word — word)
const statusEl=document.getElementById('status');
const IDLE='<span class="muted">bir düğümün veya kenarın üzerine gel…</span>';
function setStatus(html){statusEl.innerHTML=html||IDLE;}
net.on('hoverNode',p=>{const d=(G[p.node]||[]).length;setStatus(p.node+' <span class="muted">· '+d+' komşu</span>');});
net.on('hoverEdge',p=>{const e=edges.get(p.edge);if(e)setStatus(e.from+' — '+e.to);});
net.on('blurNode',()=>setStatus(null));
net.on('blurEdge',()=>setStatus(null));

const HI="#ff3b6b", DIM_N="#2a2e38", DIM_E="#23262e";
function bfs(s,t){
  if(s===t) return [s];
  const prev={}; prev[s]=null; const q=[s];
  while(q.length){
    const u=q.shift();
    for(const v of (G[u]||[])){
      if(!(v in prev)){prev[v]=u; if(v===t){const p=[t];let x=t;while(prev[x]!=null){x=prev[x];p.push(x);}return p.reverse();} q.push(v);}
    }
  }
  return null;
}
function reset(){
  nodes.update(baseNodes.map(n=>({id:n.id,color:n.color,font:{color:'#ddd',size:11}})));
  edges.update(baseEdges.map(e=>({id:e.id,color:{color:'#444'},width:0.4})));
}
function highlight(path){
  const pset=new Set(path);
  const eset=new Set(); for(let i=0;i+1<path.length;i++){const a=path[i],b=path[i+1];eset.add(a<b?a+"|"+b:b+"|"+a);}
  nodes.update(baseNodes.map(n=>pset.has(n.id)
    ?({id:n.id,color:HI,font:{color:'#fff',size:18}})
    :({id:n.id,color:DIM_N,font:{color:'#555',size:9}})));
  edges.update(baseEdges.map(e=>eset.has(e.id)
    ?({id:e.id,color:{color:HI},width:4})
    :({id:e.id,color:{color:DIM_E},width:0.2})));
  net.fit({nodes:path,animation:true});
}
document.getElementById('go').onclick=()=>{
  const a=document.getElementById('a').value.trim().toLowerCase();
  const b=document.getElementById('b').value.trim().toLowerCase();
  const r=document.getElementById('result');
  if(!nodes.get(a)){r.textContent='bulunamadı: '+a;return;}
  if(!nodes.get(b)){r.textContent='bulunamadı: '+b;return;}
  const p=bfs(a,b);
  if(!p){r.textContent='yol yok (farklı bileşenler)';reset();return;}
  highlight(p);
  r.textContent=(p.length-1)+' adım: '+p.join(' → ');
};
document.getElementById('clear').onclick=()=>{reset();document.getElementById('result').textContent='';};
document.getElementById('fit').onclick=()=>net.fit({animation:true});
document.getElementById('b').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click();});
</script></body></html>
