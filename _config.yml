title: alytarik
author: Ali Tarik
email: alimirik55@gmail.com
description: >-
  stuff i do
url: "https://alytarik.github.io"
baseurl: ""

lang: en
timezone:

remote_theme: riggraz/no-style-please

permalink: /:slug.html

theme_config:
  appearance: "auto"
  back_home_text: ".."
  date_format: "%Y-%m-%d"
  show_description: false
  lowercase_titles: true

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
  - projects.json
